# Run with:  docker compose -f dev.docker-compose.yml up --build
# Then open http://localhost:8080  (Docker Desktop on Windows, WSL2 backend).
# Re-run `docker compose -f dev.docker-compose.yml restart` to rebuild C code after edits.
# JavaScript in js/ needs no restart: a watcher rebuilds the bundles in public/js on
# every save (see the container log); reload the page to pick the change up.
# The recipe database lives in the db-data volume and survives restarts.
# Deploy to Azure with:  docker exec -it kotoa-kasin-deploy deploy  (see README.md)
services:
  httpd:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - build-cache:/build        # keep build output off the Windows bind mount
      - db-data:/data            # SQLite needs real file locking; keep it off the bind mount too
    working_dir: /app
    command: >
      sh -c "cmake -S /app -B /build -DCMAKE_BUILD_TYPE=Release &&
             cmake --build /build -j &&
             { /build/kasin-jsbundle -w -o /app/public/js /app/js/bundles.txt &
               exec /build/kasin-httpd -p 8080 -r /app/public -d /data/kotoa.db -m /app/migrations -u /data/uploads; }"

  # Deployment tooling: the official Azure CLI image, idling until you run
  # `docker exec -it kotoa-kasin-deploy deploy`. The repo is mounted read-only;
  # the scripts live in deploy/.
  deploy:
    image: mcr.microsoft.com/azure-cli:2.67.0
    container_name: kotoa-kasin-deploy
    init: true
    volumes:
      - .:/workspace:ro
      - azure-login:/root/.azure  # keeps the `az login` between restarts
    working_dir: /workspace
    command: >
      sh -c "printf '#!/bin/sh\nexec bash /workspace/deploy/bin/deploy \"$$@\"\n' > /usr/local/bin/deploy &&
             chmod +x /usr/local/bin/deploy &&
             exec sleep infinity"

volumes:
  build-cache:
  db-data:
  azure-login:
