# Run with:  docker compose -f dev.docker-compose.yml up --build
# Then open http://localhost:8080  (Docker Desktop on Windows, WSL2 backend).
# Re-run `docker compose -f dev.docker-compose.yml restart` to rebuild C code after edits.
# JavaScript in js/ and CSS in css/ need no restart: watchers rebuild the bundles in
# public/js and public/css on every save (see the container log); reload the page.
# The recipe database lives in the db-data volume and survives restarts.
# The admin password: put the line printed by
#   docker compose -f dev.docker-compose.yml exec httpd /build/kasin-passwd
# in a file named .env next to this one (never committed), then restart. Without
# it the site runs but nobody can log in.
# Deploy to Azure with:  docker exec -it kotoa-kasin-deploy deploy  (see README.md)
services:
  httpd:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - build-cache:/build        # keep build output off the Windows bind mount
      - db-data:/data            # SQLite needs real file locking; keep it off the bind mount too
    environment:
      # Read from .env by Compose; empty when there is none.
      KASIN_ADMIN_PASSWORD_HASH: ${KASIN_ADMIN_PASSWORD_HASH:-}
    working_dir: /app
    # Countries of login attempts: DB-IP's data is downloaded once into the
    # build-cache volume and again when over a month old. Without a network
    # the server still runs, recording attempts without countries.
    command: >
      sh -c "cmake -S /app -B /build -DCMAKE_BUILD_TYPE=Release &&
             cmake --build /build -j &&
             { find /build/geoip.bin -mtime -31 2>/dev/null | grep -q . ||
               { sh /app/scripts/fetch-geoip /build/geoip.csv &&
                 /build/kasin-geoip /build/geoip.csv /build/geoip.bin; rm -f /build/geoip.csv; } ||
               echo 'warning: no country data for login attempts'; } &&
             { /build/kasin-jsbundle -w -o /app/public/js /app/js/bundles.txt &
               /build/kasin-cssbundle -w -o /app/public/css /app/css/bundles.txt &
               exec /build/kasin-httpd -p 8080 -r /app/public -d /data/kotoa.db -m /app/migrations -u /data/uploads -g /build/geoip.bin; }"

  # Deployment tooling: the official Azure CLI image, idling until you run
  # `docker exec -it kotoa-kasin-deploy deploy`. The repo is mounted read-only;
  # the scripts live in deploy/.
  deploy:
    image: mcr.microsoft.com/azure-cli:2.67.0
    container_name: kotoa-kasin-deploy
    init: true
    volumes:
      - .:/workspace:ro
      - azure-login:/root/.azure  # keeps the `az login` between restarts
    working_dir: /workspace
    command: >
      sh -c "printf '#!/bin/sh\nexec bash /workspace/deploy/bin/deploy \"$$@\"\n' > /usr/local/bin/deploy &&
             chmod +x /usr/local/bin/deploy &&
             exec sleep infinity"

volumes:
  build-cache:
  db-data:
  azure-login:
