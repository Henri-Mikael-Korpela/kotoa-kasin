{{set title "Kirjaudu &mdash; Kotoa käsin"}}
{{set robots "noindex"}}
{{set bundle "admin"}}
{{set page "login"}}
{{include "head.html"}}
<body data-page="login">

  <header class="site-header admin-header">
    <div class="nav-container">
      <a href="/" class="logo">Kotoa käsin<span class="logo-badge">Hallinta</span></a>
      <nav class="admin-nav">
        <a href="/">&larr; Takaisin sivustolle</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <section class="admin-card login-card">
        <h1>Kirjaudu sisään</h1>
        <p class="admin-lead">Reseptien hallinta on vain ylläpitäjille.</p>

        <form id="loginForm" novalidate>
          <div class="form-field">
            <label for="username">Käyttäjätunnus</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>
          <div class="form-field">
            <label for="password">Salasana</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="form-error" id="loginError" role="alert"></p>
          <button type="submit" class="btn btn-primary">Kirjaudu</button>
        </form>
      </section>
    </div>
  </main>

  <script src="/js/{{bundle}}.js"></script>
</body>

</html>
