{{default home_url "/"}}

    <div class="nav-container">
      <a href="{{home_url}}" class="logo">Kotoa käsin</a>

      <nav class="nav-links" id="navLinks">
        <a href="{{home_url}}">Etusivu</a>
        <div class="nav-item" id="recipesNavItem">
          <a href="/#reseptit">Reseptit</a>
          <ul class="nav-submenu" id="categoryMenu" aria-label="Reseptikategoriat" hidden></ul>
        </div>
        <a href="/meista"{{if page == "meista"}} aria-current="page"{{end}}>Meistä</a>
        <a href="/yhteystiedot"{{if page == "yhteystiedot"}} aria-current="page"{{end}}>Yhteystiedot</a>

    </div>
