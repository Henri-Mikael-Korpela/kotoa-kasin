<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Uusi resepti &mdash; Kotoa käsin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-page="edit">

  <header class="site-header admin-header">
    <div class="nav-container">
      <a href="/hallinta" class="logo">Kotoa käsin<span class="logo-badge">Hallinta</span></a>
      <nav class="admin-nav">
        <span class="admin-user" id="adminUser"></span>
        <a href="/" target="_blank" rel="noopener">Sivusto</a>
        <button type="button" id="logoutButton">Kirjaudu ulos</button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container admin-narrow">
      <a href="/hallinta" class="back-link">&larr; Takaisin resepteihin</a>

      <section class="admin-card">
        <h1 id="editTitle">Uusi resepti</h1>
        <p class="admin-lead">Muutokset näkyvät sivustolla heti tallennuksen jälkeen.</p>

        <form id="recipeForm" novalidate>
          <div class="form-field">
            <label for="recipeName">Nimi</label>
            <input id="recipeName" type="text" maxlength="200" required>
          </div>

          <div class="form-field">
            <label for="recipeImage">Kuva</label>
            <div class="image-field">
              <div>
                <input id="recipeImage" type="text" maxlength="500" placeholder="/assets/recipes/esimerkki.jpg" spellcheck="false">
                <p class="form-hint">Kuvan osoite sivustolla, esimerkiksi /assets/recipes/laventelisaippua.jpg.</p>
              </div>
              <span class="mini-thumb" id="imagePreview"></span>
            </div>
          </div>

          <div class="form-field">
            <label for="recipeDescription">Kuvaus</label>
            <textarea id="recipeDescription" maxlength="2000"></textarea>
          </div>

          <p class="form-error" id="formError" role="alert"></p>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveButton">Tallenna</button>
            <a href="/hallinta" class="btn btn-ghost">Peruuta</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
