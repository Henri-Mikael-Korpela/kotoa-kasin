<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Reseptit &mdash; Kotoa käsin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-page="list">

  <header class="site-header admin-header">
    <div class="nav-container">
      <a href="/hallinta" class="logo">Kotoa käsin<span class="logo-badge">Hallinta</span></a>
      <nav class="admin-nav">
        <a href="/hallinta" aria-current="page">Reseptit</a>
        <a href="/hallinta/kuvat">Kuvat</a>
        <span class="admin-user" id="adminUser"></span>
        <a href="/" target="_blank" rel="noopener">Sivusto</a>
        <button type="button" id="logoutButton">Kirjaudu ulos</button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container admin-narrow">
      <div class="admin-toolbar">
        <div>
          <h1>Reseptit</h1>
          <p>Valitse resepti muokattavaksi tai lisää uusi.</p>
        </div>
        <a href="/hallinta/resepti" class="btn btn-primary">Lisää uusi resepti</a>
      </div>

      <p class="form-error" id="listError" role="alert"></p>
      <ul class="recipe-list" id="recipeList"></ul>
      <p class="admin-status" id="listStatus" aria-live="polite">Ladataan reseptejä&hellip;</p>

      <section class="admin-section" aria-labelledby="categoriesTitle">
        <div class="admin-toolbar">
          <div>
            <h2 id="categoriesTitle">Kategoriat</h2>
            <p>Jokainen resepti kuuluu yhteen kategoriaan. Kategorian voi poistaa vasta, kun siinä ei ole reseptejä.</p>
          </div>
        </div>

        <form class="category-add" id="categoryForm" novalidate>
          <label class="visually-hidden" for="newCategoryName">Uuden kategorian nimi</label>
          <input id="newCategoryName" type="text" maxlength="60" placeholder="Uuden kategorian nimi" autocomplete="off">
          <button type="submit" class="btn btn-primary">Lisää kategoria</button>
        </form>
        <p class="form-error" id="categoryError" role="alert"></p>
        <ul class="category-list" id="categoryList"></ul>
      </section>
    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script src="/js/blocks.js"></script>
  <script src="/js/gallery.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
